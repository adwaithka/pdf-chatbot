<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Chatbot</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- LEFT SIDEBAR : everything to do with the document -->
    <aside class="sidebar">

        <div class="brand">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 2.5h7l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5V4A1.5 1.5 0 0 1 7 2.5Z"/>
                    <path d="M14 2.5V7h4.5"/>
                    <path d="M9 12h6"/>
                    <path d="M9 15.5h6"/>
                    <path d="M9 8.5h2"/>
                </svg>
            </span>
            <div>
                <h1>PDF Chatbot</h1>
                <p class="tagline">Ask your documents anything</p>
            </div>
        </div>

        <section class="upload-block">
            <h2 class="section-label">Upload document</h2>

            <label class="dropzone" id="dropzone" for="pdfFile">
                <input type="file" id="pdfFile" accept="application/pdf" hidden>
                <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 2.5h7l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5V4A1.5 1.5 0 0 1 7 2.5Z"/>
                    <path d="M14 2.5V7h4.5"/>
                    <path d="M9.5 14.5h5"/>
                    <path d="M12 12v5"/>
                </svg>
                <span class="dropzone-text">Drop a PDF or <span class="browse-link">browse</span></span>
                <span class="dropzone-hint">PDF FILES ONLY</span>
            </label>

            <div class="file-chip" id="fileChip" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 2.5h7l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5V4A1.5 1.5 0 0 1 7 2.5Z"/>
                    <path d="M14 2.5V7h4.5"/>
                </svg>
                <div class="file-chip-info">
                    <span class="file-chip-name" id="fileName"></span>
                    <span class="file-chip-size" id="fileSize"></span>
                </div>
                <button class="file-chip-remove" id="removeFile" type="button" aria-label="Remove file">&times;</button>
            </div>

            <button class="btn-upload" id="uploadBtn" type="button" disabled>Upload PDF</button>

            <div id="status" class="status" role="status"></div>
        </section>

        <section class="how-it-works">
            <h2 class="section-label">How it works</h2>
            <ol class="steps">
                <li><span class="step-num">01</span>Upload your PDF</li>
                <li><span class="step-num">02</span>Wait for processing</li>
                <li><span class="step-num">03</span>Ask anything about it</li>
            </ol>
        </section>

    </aside>

    <!-- MAIN : the conversation -->
    <main class="main">

        <header class="main-header">
            <div>
                <h2>Conversation</h2>
                <p class="doc-name" id="activeDocName">No document uploaded yet</p>
            </div>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5.5c2.5-1 5-1 7 .3v13c-2-1.3-4.5-1.3-7-.3v-13Z"/>
                    <path d="M21 5.5c-2.5-1-5-1-7 .3v13c2-1.3 4.5-1.3 7-.3v-13Z"/>
                </svg>
                <p>Your conversation will show up here.<br>Upload a PDF on the left to get started.</p>
            </div>
        </div>

        <div class="input-section">
            <input
                type="text"
                id="question"
                placeholder="Ask something about the PDF..."
                autocomplete="off"
            >
            <button class="btn-send" id="sendBtn" type="button" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h13"/>
                    <path d="M13 6l6 6-6 6"/>
                </svg>
            </button>
        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
